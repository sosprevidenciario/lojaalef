<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0a0f;--bg2:#0e0e16;--bg3:#13131e;--bg4:#1a1a28;
  --accent:#7c6cff;--accent2:#5a4de6;--accent3:#3d34b3;
  --accent-dim:rgba(124,108,255,0.12);
  --text:#ffffff;--text2:#aaaaaa;--text3:#555;
  --border:rgba(124,108,255,0.12);--border2:rgba(124,108,255,0.28);
  --red:#ff3355;--green:#00e676;--amber:#ffaa00;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
.hidden{display:none!important;}
.mono{font-family:'Space Mono',monospace;}
#bg-canvas{position:fixed;inset:0;opacity:.04;pointer-events:none;z-index:0;}

/* NAV */
.store-nav{display:flex;align-items:center;height:60px;padding:0 24px;background:rgba(10,10,15,0.97);border-bottom:1px solid var(--border);gap:20px;position:sticky;top:0;z-index:200;backdrop-filter:blur(10px);}
.store-logo{font-size:18px;font-weight:900;color:var(--accent);letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 20px rgba(124,108,255,0.4);cursor:pointer;flex-shrink:0;font-family:'Space Mono',monospace;}
.store-nav-links{display:flex;flex:1;gap:2px;overflow-x:auto;}
.snl{padding:0 12px;height:60px;display:flex;align-items:center;font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;border:none;background:none;letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid transparent;transition:all .15s;font-family:'Inter',sans-serif;white-space:nowrap;flex-shrink:0;}
.snl:hover{color:var(--text2);}.snl.on{color:var(--accent);border-bottom-color:var(--accent);}
.store-nav-r{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.cart-btn{position:relative;padding:8px 16px;background:var(--accent-dim);border:1px solid var(--border2);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;font-family:'Inter',sans-serif;}
.cart-btn:hover{background:rgba(124,108,255,0.22);}
.cart-badge{position:absolute;top:-7px;right:-7px;width:20px;height:20px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;border-radius:50%;display:flex;align-items:center;justify-content:center;}

/* HERO */
.store-hero{padding:72px 28px;text-align:center;border-bottom:1px solid var(--border);background:radial-gradient(ellipse at 50% 0%, rgba(124,108,255,0.08) 0%, transparent 70%);position:relative;overflow:hidden;}
.store-hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(124,108,255,0.03) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(124,108,255,0.03) 40px);}
.store-hero-eyebrow{font-size:10px;color:var(--accent);letter-spacing:4px;text-transform:uppercase;font-weight:600;margin-bottom:14px;font-family:'Space Mono',monospace;position:relative;}
.store-hero-title{font-size:54px;font-weight:900;line-height:1.05;margin-bottom:18px;position:relative;}
.store-hero-title span{color:var(--accent);}
.store-hero-sub{font-size:15px;color:var(--text2);max-width:500px;margin:0 auto;position:relative;line-height:1.6;}

/* FILTROS */
.store-filters{padding:16px 28px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--bg2);}
.filter-chip{padding:6px 16px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:1px solid var(--border);color:var(--text3);background:transparent;transition:all .15s;font-family:'Inter',sans-serif;}
.filter-chip:hover{border-color:var(--accent);color:var(--accent);}
.filter-chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

/* GRID */
.store-grid-wrap{padding:28px;position:relative;z-index:1;}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.prod-card{background:var(--bg2);border:1px solid var(--border);cursor:pointer;transition:all .22s;position:relative;overflow:hidden;}
.prod-card:hover{border-color:var(--accent2);transform:translateY(-4px);box-shadow:0 10px 36px rgba(124,108,255,0.18);}
.prod-img{height:168px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:52px;border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
.prod-img img{width:100%;height:100%;object-fit:cover;}
.prod-badge{position:absolute;top:8px;left:8px;padding:3px 8px;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:var(--accent);color:#fff;}
.prod-info{padding:14px;}
.prod-cat{font-size:9px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:4px;font-family:'Space Mono',monospace;}
.prod-name{font-size:14px;font-weight:700;margin-bottom:6px;line-height:1.3;}
.prod-desc{font-size:11px;color:var(--text3);line-height:1.5;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.prod-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.prod-price{font-size:18px;font-weight:800;color:var(--accent);font-family:'Space Mono',monospace;}
.add-btn{padding:8px 14px;background:var(--accent);color:#fff;border:none;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;flex-shrink:0;}
.add-btn:hover{background:var(--accent2);}
.empty-state{grid-column:1/-1;padding:100px 0;text-align:center;color:var(--text3);}
.empty-icon{font-size:48px;margin-bottom:16px;}

/* CARRINHO DRAWER */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:400;display:flex;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;}
.cart-overlay.open{opacity:1;pointer-events:all;}
.cart-drawer{width:390px;max-width:100vw;height:100vh;background:var(--bg2);border-left:1px solid var(--border2);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
.cart-overlay.open .cart-drawer{transform:translateX(0);}
.cart-top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
.cart-title{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;}
.xbtn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;line-height:1;padding:4px;}
.xbtn:hover{color:var(--red);}
.cart-items{flex:1;overflow-y:auto;padding:12px 16px;}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:13px;gap:12px;text-align:center;}
.cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
.ci-emoji{width:46px;height:46px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:13px;font-weight:700;margin-bottom:3px;line-height:1.3;}
.ci-unit{font-size:11px;color:var(--text3);margin-bottom:6px;}
.ci-price{font-size:13px;color:var(--accent);font-family:'Space Mono',monospace;font-weight:700;}
.ci-controls{display:flex;align-items:center;gap:8px;margin-top:8px;}
.qty-btn{width:26px;height:26px;background:var(--bg4);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1;}
.qty-btn:hover{border-color:var(--accent);color:var(--accent);}
.qty-num{font-size:13px;font-weight:700;min-width:24px;text-align:center;font-family:'Space Mono',monospace;}
.ci-remove{margin-left:auto;background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px;align-self:flex-start;}
.ci-remove:hover{color:var(--red);}
.cart-footer{padding:16px 20px;border-top:1px solid var(--border);background:var(--bg2);}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cart-total-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;}
.cart-total-val{font-size:24px;font-weight:800;color:var(--accent);font-family:'Space Mono',monospace;}
.btn-whatsapp{width:100%;padding:15px;background:#25D366;color:#fff;border:none;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;}
.btn-whatsapp:hover{background:#1db954;}
.btn-whatsapp:disabled{opacity:.4;cursor:not-allowed;background:#25D366;}
.cart-note{font-size:10px;color:var(--text3);text-align:center;margin-top:10px;line-height:1.5;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;max-width:280px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.s{background:var(--green);color:#000;}
.toast.e{background:var(--red);color:#fff;}
.toast.i{background:var(--accent);color:#fff;}

/* MANUTENÇÃO */
.manut{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:16px;position:relative;z-index:1;}
.manut-icon{font-size:56px;}
.manut-title{font-size:28px;font-weight:900;}
.manut-sub{font-size:14px;color:var(--text3);}

@media(max-width:768px){
  .store-hero-title{font-size:34px;}
  .store-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
  .cart-drawer{width:100vw;}
  .store-nav-links{display:none;}
  .store-filters{padding:12px 16px;}
  .store-grid-wrap{padding:16px;}
  .store-hero{padding:48px 16px;}
}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="toast" class="toast"></div>

<!-- LOJA -->
<div id="loja-wrap">
  <nav class="store-nav">
    <div class="store-logo" id="store-logo" onclick="filterCat('todos')">LOJA</div>
    <div class="store-nav-links" id="nav-cats">
      <button class="snl on" onclick="filterCat('todos')">Todos</button>
    </div>
    <div class="store-nav-r">
      <button class="cart-btn" onclick="openCart()">
        🛒 Carrinho
        <span class="cart-badge hidden" id="cart-badge">0</span>
      </button>
    </div>
  </nav>

  <div id="manut-screen" class="manut hidden">
    <div class="manut-icon">🔧</div>
    <div class="manut-title">Em manutenção</div>
    <div class="manut-sub">Voltamos em breve. Obrigado pela paciência!</div>
  </div>

  <div id="loja-conteudo">
    <div class="store-hero">
      <div class="store-hero-eyebrow" id="hero-eyebrow">Bem-vindo à nossa loja</div>
      <h1 class="store-hero-title" id="hero-title">Os melhores <span>produtos</span><br>estão aqui</h1>
      <p class="store-hero-sub" id="hero-sub">Escolha os produtos, adicione ao carrinho e finalize direto pelo WhatsApp.</p>
    </div>

    <div class="store-filters hidden" id="store-filters"></div>

    <div class="store-grid-wrap">
      <div class="store-grid" id="store-grid"></div>
    </div>
  </div>
</div>

<!-- CARRINHO DRAWER -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCartOutside(event)">
  <div class="cart-drawer">
    <div class="cart-top">
      <div class="cart-title">🛒 Meu Carrinho</div>
      <button class="xbtn" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-items" id="cart-items-list"></div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <div class="cart-total-lbl">Total</div>
        <div class="cart-total-val" id="cart-total-val">R$ 0,00</div>
      </div>
      <button class="btn-whatsapp" id="btn-finalizar" onclick="finalizarPedido()" disabled>
        <span style="font-size:18px;">💬</span> Finalizar pelo WhatsApp
      </button>
      <div class="cart-note">Você será redirecionado ao WhatsApp da loja para confirmar o pedido.</div>
    </div>
  </div>
</div>

<script>
// ── STATE ──
let DB = { produtos:[], categorias:[], aparencia:{nome:'LOJA',slogan:'Os melhores produtos',sub:'Escolha e finalize pelo WhatsApp.',cor:'#7c6cff',icon:'🏪'}, config:{whatsapp:'',msg:'Olá! Gostaria de fazer o seguinte pedido:',online:true} };
let cart = [];
let currentCat = 'todos';

// ── STORAGE ──
function loadDB(){
  try{ const r=localStorage.getItem('lojadb'); if(r) Object.assign(DB,JSON.parse(r)); }catch(e){}
}

// ── CANVAS ──
(function(){
  const c=document.getElementById('bg-canvas'),ctx=c.getContext('2d');
  function resize(){c.width=innerWidth;c.height=innerHeight;}
  resize();window.addEventListener('resize',resize);
  const cols=Math.floor(innerWidth/22),drops=Array(cols).fill(1),chars='01+-×÷▲▼◆';
  setInterval(()=>{
    ctx.fillStyle='rgba(10,10,15,0.06)';ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle=DB.aparencia?.cor||'#7c6cff';ctx.font='13px Space Mono,monospace';
    drops.forEach((y,i)=>{ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*22,y*22);if(y*22>c.height&&Math.random()>.975)drops[i]=0;drops[i]++;});
  },90);
})();

// ── TOAST ──
let toastT;
function toast(msg,type='s'){
  const t=document.getElementById('toast');t.textContent=msg;t.className=`toast ${type} show`;
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800);
}

// ── APPLY APARENCIA ──
function applyAparencia(){
  const a=DB.aparencia||{};
  const cor=a.cor||'#7c6cff';
  setCSS('--accent',cor);setCSS('--accent2',shade(cor,-22));setCSS('--accent-dim',rgba(cor,.12));setCSS('--border',rgba(cor,.12));setCSS('--border2',rgba(cor,.28));
  const nome=a.nome||'LOJA';
  document.getElementById('store-logo').textContent=nome;
  document.title=nome;
  document.getElementById('page-title').textContent=nome;
  document.getElementById('hero-eyebrow').textContent='Bem-vindo à '+nome;
  document.getElementById('hero-title').innerHTML=`${a.slogan||'Os melhores produtos'} <span style="color:var(--accent)">estão aqui</span>`;
  document.getElementById('hero-sub').textContent=a.sub||'Escolha e finalize pelo WhatsApp.';
}

// ── RENDER STORE ──
function renderStore(){
  const online=DB.config?.online!==false;
  document.getElementById('manut-screen').classList.toggle('hidden',online);
  document.getElementById('loja-conteudo').classList.toggle('hidden',!online);
  if(!online) return;

  const prods=DB.produtos.filter(p=>p.ativo);
  const catsUsadas=[...new Set(prods.map(p=>p.cat).filter(Boolean))];

  // nav cats
  const navCats=document.getElementById('nav-cats');
  navCats.innerHTML=`<button class="snl ${currentCat==='todos'?'on':''}" onclick="filterCat('todos')">Todos</button>`+
    catsUsadas.map(cid=>{
      const cat=DB.categorias.find(c=>c.id===cid);
      return cat?`<button class="snl ${currentCat===cid?'on':''}" onclick="filterCat('${cid}')">${cat.emoji} ${cat.nome}</button>`:'';
    }).join('');

  // filtros
  const filtersEl=document.getElementById('store-filters');
  if(catsUsadas.length>1){
    filtersEl.classList.remove('hidden');
    filtersEl.innerHTML=`<button class="filter-chip ${currentCat==='todos'?'on':''}" onclick="filterCat('todos')">Todos (${prods.length})</button>`+
      catsUsadas.map(cid=>{
        const cat=DB.categorias.find(c=>c.id===cid);
        if(!cat) return '';
        const qty=prods.filter(p=>p.cat===cid).length;
        return `<button class="filter-chip ${currentCat===cid?'on':''}" onclick="filterCat('${cid}')">${cat.emoji} ${cat.nome} (${qty})</button>`;
      }).join('');
  } else { filtersEl.classList.add('hidden'); }

  renderGrid();
}

function filterCat(cid){ currentCat=cid; renderStore(); }

function renderGrid(){
  const grid=document.getElementById('store-grid');
  let prods=DB.produtos.filter(p=>p.ativo);
  if(currentCat!=='todos') prods=prods.filter(p=>p.cat===currentCat);
  prods.sort((a,b)=>(b.destaque?1:0)-(a.destaque?1:0));

  if(!prods.length){
    grid.innerHTML=`<div class="empty-state"><div class="empty-icon">📦</div><div>${DB.produtos.length?'Nenhum produto nesta categoria.':'Nenhum produto disponível no momento.'}</div></div>`;
    return;
  }
  grid.innerHTML=prods.map(p=>{
    const cat=DB.categorias.find(c=>c.id===p.cat);
    const imgHtml=p.img
      ?`<img src="${p.img}" onerror="this.parentElement.innerHTML='<span style=font-size:52px>${p.emoji||'📦'}</span>'">`
      :`<span style="font-size:52px;">${p.emoji||'📦'}</span>`;
    return `<div class="prod-card">
      <div class="prod-img">${imgHtml}${p.destaque?'<span class="prod-badge">⭐ Destaque</span>':''}</div>
      <div class="prod-info">
        ${cat?`<div class="prod-cat">${cat.emoji} ${cat.nome}</div>`:''}
        <div class="prod-name">${p.nome}</div>
        ${p.desc?`<div class="prod-desc">${p.desc}</div>`:''}
        <div class="prod-footer">
          <div class="prod-price">${fmtPrice(p.preco)}</div>
          <button class="add-btn" onclick="addToCart('${p.id}')">+ Carrinho</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── CARRINHO ──
function addToCart(id){
  const p=DB.produtos.find(x=>x.id===id);if(!p) return;
  const ex=cart.find(x=>x.id===id);
  if(ex) ex.qty++;
  else cart.push({id,nome:p.nome,preco:p.preco,emoji:p.emoji||'📦',qty:1});
  updateBadge();renderCartDrawer();toast(`${p.emoji||'📦'} ${p.nome} adicionado!`,'i');
}
function removeFromCart(id){ cart=cart.filter(x=>x.id!==id);updateBadge();renderCartDrawer(); }
function changeQty(id,d){ const i=cart.find(x=>x.id===id);if(!i) return;i.qty+=d;if(i.qty<=0)removeFromCart(id);else{updateBadge();renderCartDrawer();} }
function updateBadge(){ const n=cart.reduce((s,i)=>s+i.qty,0);const b=document.getElementById('cart-badge');b.textContent=n;b.classList.toggle('hidden',n===0); }
function openCart(){ document.getElementById('cart-overlay').classList.add('open');renderCartDrawer(); }
function closeCart(){ document.getElementById('cart-overlay').classList.remove('open'); }
function closeCartOutside(e){ if(e.target===document.getElementById('cart-overlay')) closeCart(); }

function renderCartDrawer(){
  const el=document.getElementById('cart-items-list');
  const btn=document.getElementById('btn-finalizar');
  if(!cart.length){
    el.innerHTML=`<div class="cart-empty"><div style="font-size:42px;">🛒</div><div>Seu carrinho está vazio</div><div style="font-size:11px;color:var(--text3);">Adicione produtos para continuar</div></div>`;
    document.getElementById('cart-total-val').textContent='R$ 0,00';
    btn.disabled=true;return;
  }
  const total=cart.reduce((s,i)=>s+(i.preco*i.qty),0);
  el.innerHTML=cart.map(i=>`
    <div class="cart-item">
      <div class="ci-emoji">${i.emoji}</div>
      <div class="ci-info">
        <div class="ci-name">${i.nome}</div>
        <div class="ci-unit">${fmtPrice(i.preco)} / un.</div>
        <div class="ci-price">${fmtPrice(i.preco*i.qty)}</div>
        <div class="ci-controls">
          <button class="qty-btn" onclick="changeQty('${i.id}',-1)">−</button>
          <span class="qty-num">${i.qty}</span>
          <button class="qty-btn" onclick="changeQty('${i.id}',1)">+</button>
        </div>
      </div>
      <button class="ci-remove" onclick="removeFromCart('${i.id}')">🗑</button>
    </div>`).join('');
  document.getElementById('cart-total-val').textContent=fmtPrice(total);
  btn.disabled=false;
}

function finalizarPedido(){
  const whats=DB.config?.whatsapp;
  if(!whats){ toast('WhatsApp não configurado','e');return; }
  if(!cart.length){ toast('Carrinho vazio','e');return; }
  const total=cart.reduce((s,i)=>s+(i.preco*i.qty),0);
  const msg=DB.config?.msg||'Olá! Gostaria de fazer o seguinte pedido:';
  const itens=cart.map(i=>`• ${i.emoji} *${i.nome}* x${i.qty} — ${fmtPrice(i.preco*i.qty)}`).join('\n');
  const loja=DB.aparencia?.nome||'Loja';
  const texto=`${msg}\n\n${itens}\n\n💰 *Total: ${fmtPrice(total)}*\n\n_Pedido enviado pelo site ${loja}_`;
  window.open(`https://wa.me/${whats}?text=${encodeURIComponent(texto)}`,'_blank');
}

// ── UTILS ──
function fmtPrice(v){ return 'R$ '+Number(v).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function setCSS(prop,val){ document.documentElement.style.setProperty(prop,val); }
function shade(hex,pct){ const n=parseInt(hex.replace('#',''),16);const r=Math.min(255,Math.max(0,(n>>16)+pct));const g=Math.min(255,Math.max(0,((n>>8)&0xFF)+pct));const b=Math.min(255,Math.max(0,(n&0xFF)+pct));return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0'); }
function rgba(hex,a){ const n=parseInt(hex.replace('#',''),16);return `rgba(${n>>16},${(n>>8)&0xFF},${n&0xFF},${a})`; }
